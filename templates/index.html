<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Steganography</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url('https://img.freepik.com/premium-vector/digital-data-encryption-background_1406-108.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background-color: rgba(74, 48, 122, 0.9);
            color: #fff;
            min-height: 62vh;
            border-radius: 15px;
        }

        .form-label,
        .form-control,
        textarea {
            color: #fff;
        }

        .form-control,
        textarea {
            background-color: rgba(158, 158, 158, 0.1);
            border: 1px solid #ccc;
        }

        .form-control:focus {
            background-color: rgba(97, 96, 96, 0.2);
            color: white;
        }

        .form-control::placeholder {
            color: white;
            opacity: 1;
        }

        h1 {
            color: #ffffff;
            margin-top: 30px;
        }

        nav {
            background-color: #1b083e;
        }

        .nav-link {
            color: #fff;
        }

        .nav-link.active {
            font-weight: bold;
            background-color: #3b1f6b;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark px-3">
        <a class="navbar-brand" href="#">Steganography</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link active" href="#">Home</a>
            </li>
        </ul>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-5">Steganography Portal</h1>
        <div class="row justify-content-center g-4">

            <!-- Encode Card -->
            <div class="col-md-5">
                <div class="card p-4 shadow">
                    <h3 class="text-center mb-4">Encode Message</h3>
                    <form id="hideForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="InImage" class="form-label">Select Input Image:</label>
                            <input type="file" class="form-control" id="InImage" name="image" accept="image/*" required>
                        </div>
                        <div class="mb-3">
                            <label for="InMessage" class="form-label">Enter Text Message:</label>
                            <textarea class="form-control" id="InMessage" name="message" rows="4"
                                placeholder="Type here..." required></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-light text-dark fw-semibold">Encode</button>
                        </div>
                        <div id="success" class="mt-3 text-info fw-semibold">Report:</div>
                    </form>
                </div>
            </div>

            <!-- Decode Card -->
            <div class="col-md-5">
                <div class="card p-4 shadow">
                    <h3 class="text-center mb-4">Decode Message</h3>
                    <form id="extractForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="OutImage" class="form-label">Select Image:</label>
                            <input type="file" class="form-control" id="OutImage" name="image" accept="image/*"
                                required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-light text-dark fw-semibold">Decode</button>
                        </div>
                        <div id="output" class="mt-3 text-info">Hidden Message:</div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("hideForm").addEventListener("submit", function (event) {
                event.preventDefault();
                var formData = new FormData(this);
                fetch("/hide_message", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to hide message.');
                        return response.json();
                    })
                    .then(data => {
                        document.getElementById("success").textContent = "Report: Message Hidden Successfully!";
                        document.getElementById("InMessage").value = "";
                    })
                    .catch(error => console.error("Error:", error));
            });

            document.getElementById("extractForm").addEventListener("submit", function (event) {
                event.preventDefault();
                var formData = new FormData(this);
                fetch("/extract_message", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) throw new Error('Failed to extract message.');
                        return response.json();
                    })
                    .then(data => {
                        document.getElementById("output").textContent = "Hidden message: " + data.message;
                    })
                    .catch(error => console.error("Error:", error));
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
